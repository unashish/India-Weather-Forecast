name: Update India forecast dashboard

# One workflow downloads the latest ECMWF IFS data, draws the maps and
# publishes the dashboard to GitHub Pages in the same run.
#
# (Earlier, a separate deploy workflow waited for a push, but pushes made by
# GitHub Actions never trigger other workflows, so the site stopped updating.)

on:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: india-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev gdal-bin libgdal-dev proj-bin libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate latest forecast maps
        env:
          IFS_MAX_RETRIES: "3"
          IFS_RETRY_SLEEP_SECONDS: "10"
          IFS_DOWNLOAD_TIMEOUT_SECONDS: "180"
        run: python ifs_code.py

      - name: Show run summary
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("latest_run.json"))
          print("Status:", d["status"], "| generated:", d["generated_at_utc"], "| source:", d["source"])
          for var, steps in d["summary"].items():
              print(f"  {var:7s}", "  ".join(f"{s}h:{'ok' if v == 'ok' else 'FAILED'}" for s, v in steps.items()))
          EOF

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html latest_run.json _site/
          cp plot_*.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
